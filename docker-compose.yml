services:
  app:
    build:
      context: .
      target: production
    ports:
      - "3000:3000"
    environment:
      TTL: 60
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
  app-dev:
    build:
      context: .
      target: development
    ports:
      - "3000:3000"
    environment:
      TTL: 60
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      redis:
        condition: service_healthy
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  redis-insight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    depends_on:
      redis:
        condition: service_healthy
volumes:
  redis-data:
